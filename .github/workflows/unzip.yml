name: Build and Release QuangClient

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: install dependencies
        run: brew install ldid xz

      - name: setup theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: setup ios sdk
        run: |
          rm -rf $HOME/theos/sdks
          git clone --quiet --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: set timezone to thailand
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Bangkok /etc/localtime
          echo "TZ=Asia/Bangkok" >> $GITHUB_ENV
          date

      - name: build package
        run: |
          make clean
          make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: prepare build directory
        run: |
          mkdir -p build
          # ค้นหาไฟล์ .deb ทั้งใน .theos/packages/ และ packages/ เพื่อความชัวร์
          DEB_FILE=$(find . -path "*/packages/*.deb" -type f | head -n 1)

          if [ -n "$DEB_FILE" ]; then
            echo "Found package at: $DEB_FILE"
            cp "$DEB_FILE" build/QuangClient.deb
          else
            echo "::error::No .deb file found in .theos/packages/ or packages/!"
            exit 1
          fi

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QuangClient-deb
          path: build/QuangClient.deb

      - name: upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: build/QuangClient.deb

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-deb
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          QuangClient Nightly Build

          Last 12 hours commits:

          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "Initial nightly release" \
            --prerelease

          gh release edit nightly \
            --title "QuangClient Nightly Build" \
            --notes-file release_notes.txt \
            --prerelease

          gh release upload nightly build/QuangClient.deb --clobber
